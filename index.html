<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundDrawer – Image ↔ Sound</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>SoundDrawer</h1>
      <p class="subtitle">Upload an image → hear it as sound · Export / Import WAV · Draw waveform, spectrogram or reconstruct the image</p>
    </header>

    <main>
      <!-- Image to Sound -->
      <section class="panel" id="image-panel">
        <h2>1. Image → Sound</h2>
        <div class="drop-zone" id="image-drop">
          <p>Drop image here or click to select</p>
          <input type="file" id="image-input" accept="image/*" hidden />
        </div>
        <div class="preview-row">
          <canvas id="image-canvas" width="320" height="240"></canvas>
          <div class="controls">
            <label>
              Duration (seconds)
              <input type="number" id="duration" value="8" min="1" max="30" step="0.5" />
            </label>
            <label>
              Min Frequency (Hz)
              <input type="number" id="min-freq" value="200" min="50" max="5000" />
            </label>
            <label>
              Max Frequency (Hz)
              <input type="number" id="max-freq" value="20000" min="1000" max="20000" />
            </label>
            <label>
              Sample Rate
              <select id="sample-rate">
                <option value="22050">22050 Hz</option>
                <option value="44100">44100 Hz</option>
                <option value="48000" selected>48000 Hz</option>
              </select>
            </label>
            <button id="generate-btn" disabled>Generate Sound</button>
            <button id="play-btn" disabled>Play</button>
            <button id="stop-btn" disabled>Stop</button>
            <button id="export-btn" disabled>Export WAV</button>
          </div>
        </div>
      </section>

      <!-- Sound Import & Draw -->
      <section class="panel" id="sound-panel">
        <h2>2. Import Sound → Draw</h2>
        <div class="drop-zone" id="audio-drop">
          <p>Drop WAV here or click to select</p>
          <input type="file" id="audio-input" accept="audio/wav,audio/*" hidden />
        </div>
        <div class="draw-controls">
          <button id="draw-waveform-btn" disabled>Draw Waveform</button>
          <button id="draw-spectrogram-btn" disabled>Draw Spectrogram</button>
          <button id="draw-image-btn" disabled>Draw Image from Sound</button>
          <button id="export-image-btn" disabled>Export Image</button>
          <button id="play-imported-btn" disabled>Play Imported</button>
        </div>
        <canvas id="draw-canvas" width="800" height="400"></canvas>
      </section>
    </main>

    <footer>
      <p>SoundDrawer · Pure client-side · Ready for GitHub Pages</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
